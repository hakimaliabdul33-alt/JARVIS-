plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.vyra.app'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/vyra-release.jks")
            storePassword project.findProperty("VYRA_STORE_PASSWORD")
            keyAlias project.findProperty("VYRA_KEY_ALIAS")
            keyPassword project.findProperty("VYRA_STORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId 'com.vyra.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    dependencies {
        implementation platform('com.google.firebase:firebase-bom:34.2.0')
        implementation 'com.google.firebase:firebase-auth'
        implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-transformer:1.8.0'
    implementation 'androidx.media3:media3-effect:1.8.0'
    implementation 'androidx.media3:media3-common:1.8.0'
    }
}
